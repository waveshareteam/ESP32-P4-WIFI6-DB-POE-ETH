dependencies:
  idf:
    version: ">=5.5"
  espressif/brookesia_hal_interface:
    version: 0.8.*
    require: public
  espressif/brookesia_hal_adaptor:
    version: ^0.8.4
  espressif/esp_board_manager:
    version: ^0.7.3~1
  espressif/esp_lvgl_adapter:
    version: ^0.6.2
  espressif/esp_codec_dev:
    version: ^2.0.0-beta4
  espressif/brookesia_service_audio: ^0.8.2
  jason-mao/av_processor:
    version: 0.6.*
    matches:
      - if: $CONFIG{ESP_HAL_BOARDS_AUDIO_ENABLE_PROCESSOR} == True
  espressif/esp-boost:
    version: ^0.6.0
    require: private
    matches:
      - if: $CONFIG{ESP_HAL_BOARDS_AUDIO_ENABLE_PROCESSOR} == True
