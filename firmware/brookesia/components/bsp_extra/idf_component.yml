version: 0.0.2
description: Project-specific extensions for ESP32-P4-WIFI6-DB-POE-ETH
targets:
  - esp32p4
dependencies:
  idf:
    version: ">=5.5"

  # Board support
  esp32_p4_wifi6_db_poe_eth:
    override_path: "../../../../components/esp32_p4_wifi6_db_poe_eth"
    public: true
  espressif/esp_lvgl_adapter:
    version: "0.6.3"

  # Audio player
  chmorgan/esp-audio-player:
    version: "1.1.0"
    public: true
  chmorgan/esp-file-iterator:
    version: "1.0.0"
    public: true

  # Wi-Fi over the ESP32-C5 co-processor (esp_hosted)
  espressif/esp_wifi_service:
    version: "^0.5.3"
    public: true
  espressif/esp_wifi_remote:
    version: "^1.6.4"
    public: true
  espressif/esp_hosted:
    version: "^3.0.9"
    public: true
